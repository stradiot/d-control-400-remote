# ======================================================================
# CORE ESPHOME CONFIGURATION
# ======================================================================
esphome:
  name: d-control-400
  includes:
    - cc1101.h
    - ../include/pinout.h
    - ../include/signal.h
  libraries:
    - SPI
    - jgromes/RadioLib@^6.0.0
  on_boot:
    # Priority 600 runs early in the boot sequence, before Wi-Fi connects
    priority: 600
    then:
      # 0. Report why the chip last reset (see the log_reset_reason script).
      #    on_boot runs before Wi-Fi is up, so this line only ever lands on the
      #    USB serial console; the api on_client_connected trigger below repeats
      #    it for the network log, which is where it actually gets read.
      - script.execute: log_reset_reason
      # 1. Immediately turn the LED Solid Red to indicate boot-up
      - light.turn_on:
          id: status_led
          brightness: 50%
          red: 1.0
          green: 0.0
          blue: 0.0
      # 2. Run the custom C++ CC1101 initialization routine
      - lambda: |-
          if (!cc1101_ctrl::setup()) {
            ESP_LOGE("cc1101", "CC1101 initialization failed!");
          }

esp32:
  board: lolin_c3_mini
  framework:
    type: arduino

# Enable standard Home Assistant API and over-the-air updates
api:
  encryption:
    key: !secret api_encryption_key
  # Repeat the reset reason whenever a client attaches, so `esphome logs` sees it
  # even though it connects long after on_boot has run. esp_reset_reason() reads a
  # latched RTC register, so it stays valid for the whole boot and can be re-read.
  on_client_connected:
    - script.execute: log_reset_reason
logger:
ota:
  - platform: esphome

# ======================================================================
# NETWORK CONFIGURATION
# ======================================================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # CRITICAL HARDWARE FIX: Clamp the Wi-Fi transmit power to prevent
  # a voltage brownout on the ESP32-C3's tiny voltage regulator.
  output_power: 8.5dBm

  on_connect:
    - if:
        # Check the C++ flag to see if the CC1101 initialized properly
        condition:
            lambda: 'return cc1101_ctrl::is_ready();'
        then:
          # SUCCESS: Both Wi-Fi and Radio are good! Flash Green, then turn off.
          - light.turn_on:
              id: status_led
              brightness: 50%
              red: 0.0
              green: 1.0
              blue: 0.0
          - delay: 500ms
          - light.turn_off: status_led
        else:
          # HARDWARE FAILURE: Radio failed to init. Lock the LED to Solid Red.
          - light.turn_on:
              id: status_led
              brightness: 50%
              red: 1.0
              green: 0.0
              blue: 0.0

# ======================================================================
# HARDWARE COMPONENTS
# ======================================================================

# Onboard WS2812B RGB LED (NeoPixel)
light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: GRB
    pin: 7
    num_leds: 1
    name: "Status LED"
    id: status_led
    # Disable ESPHome's default 1-second fade animation for instant response
    default_transition_length: 0s
    internal: true

# Liveness heartbeat. An idle device was previously dark, which is
# indistinguishable from one that is dead or unpowered.
#
# The colour carries the Wi-Fi state, and that is the point rather than a
# flourish: a device whose Wi-Fi has dropped is alive and transmitting fine but
# completely invisible -- no Home Assistant entity, no `esphome logs`. The LED is
# the only witness to that failure, so a plain green pulse there would be a false
# all-clear. Amber says "alive, radio OK, but you cannot reach me".
#
# Gating on is_ready() also sharpens the solid-red state: red used to mean
# "booting OR radio init failed", and now a board that sits red and never pulses
# has exactly one problem.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            and:
              # Radio init failed -> leave the solid red alone.
              - lambda: 'return cc1101_ctrl::is_ready();'
              # Never fight the blue transmit indication.
              - not:
                  script.is_running: transmit_beep
          then:
            - if:
                condition: wifi.connected
                then:
                  - light.turn_on:
                      id: status_led
                      brightness: 15%
                      red: 0.0
                      green: 1.0
                      blue: 0.0
                else:
                  - light.turn_on:
                      id: status_led
                      brightness: 15%
                      red: 1.0
                      green: 0.35
                      blue: 0.0
            # Short and dim: this repeats forever, unlike the one-off boot flash.
            - delay: 80ms
            # Re-check before clearing. A trigger that arrived during the pulse has
            # already set the LED blue, and an unconditional turn_off here would
            # blank it for the whole ~3 s transmission. Guarding only the start of
            # the pulse does not close this window.
            - if:
                condition:
                  not:
                    script.is_running: transmit_beep
                then:
                  - light.turn_off: status_led

script:
  # Why the chip last reset. The ROM prints this on UART0 at boot, but those
  # messages never reach the network log, so re-emit it as a normal log line.
  #   BROWNOUT           -> the supply rail sagged; PA duty is too high for the LDO
  #   TASK_WDT / INT_WDT -> the scheduler was starved by vTaskSuspendAll()
  # The two have opposite fixes, which is the whole reason for logging it.
  - id: log_reset_reason
    mode: single
    then:
      - lambda: |-
          const char *why;
          switch (esp_reset_reason()) {
            case ESP_RST_POWERON:   why = "POWERON (normal cold boot)"; break;
            case ESP_RST_SW:        why = "SW (esp_restart, e.g. OTA)"; break;
            case ESP_RST_PANIC:     why = "PANIC (exception / abort)"; break;
            case ESP_RST_INT_WDT:   why = "INT_WDT (interrupt watchdog)"; break;
            case ESP_RST_TASK_WDT:  why = "TASK_WDT (task watchdog)"; break;
            case ESP_RST_WDT:       why = "WDT (other watchdog)"; break;
            case ESP_RST_BROWNOUT:  why = "BROWNOUT (supply rail sagged)"; break;
            case ESP_RST_EXT:       why = "EXT (reset pin)"; break;
            case ESP_RST_DEEPSLEEP: why = "DEEPSLEEP"; break;
            default:                why = "UNKNOWN"; break;
          }
          ESP_LOGW("boot", "last reset reason: %s", why);

  # Script to transmit the beep sequence
  - id: transmit_beep
    mode: single
    then:
      - if:
          # SAFETY CHECK: Only allow transmission if the radio is physically responding
          condition:
            lambda: 'return cc1101_ctrl::is_ready();'
          then:
            # 1. Turn LED Blue to indicate transmission
            - light.turn_on:
                id: status_led
                brightness: 80%
                red: 0.0
                green: 0.0
                blue: 1.0
            # 2. Yield 500ms so ESPHome can physically push the Blue color to the LED
            - delay: 500ms
            # 3. Hijack the CPU and bit-bang the SDR timings to the radio
            - lambda: |-
                if (!cc1101_ctrl::transmit_beep_signal()) {
                  ESP_LOGE("cc1101", "Beep signal transmission failed!");
                }
            # 4. Turn LED off when finished
            - light.turn_off: status_led
          else:
            - logger.log:
                level: ERROR
                format: "Cannot transmit: CC1101 Radio is not initialized!"
      # 5. NEW: Reset the switch back to OFF in Home Assistant only after everything is done
      - switch.template.publish:
          id: beep_switch
          state: OFF

# Home Assistant Dashboard Switch (momentary)
switch:
  - platform: template
    name: "Trigger Collar Beep"
    icon: "mdi:volume-high"
    id: beep_switch
    restore_mode: ALWAYS_OFF
    optimistic: false
    turn_on_action:
      - switch.template.publish:
          id: beep_switch
          state: ON
      - script.execute: transmit_beep

# Physical BOOT button on the Lolin C3 Mini
binary_sensor:
  - platform: gpio
    pin:
      number: 9 # GPIO 9 is the standard strapping/boot pin
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Physical Boot Button"
    internal: true
    on_press:
      # Map the physical button press directly to the Home Assistant software button
      - switch.turn_on: beep_switch


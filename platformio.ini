[env:lolin_c3_mini]
; Pinned to the pioarduino fork by URL, not left as a bare `espressif32`.
; A bare name resolves from the official PlatformIO registry, which stalled at
; 6.x (Arduino core 2.x / IDF 4.4) and does NOT provide this toolchain -- it
; only works here because the fork happens to be installed already. A fresh
; clone would silently build against a different compiler and a different
; FreeRTOS, which for a bit-banged microsecond RF loop is not a difference
; worth discovering in the field. This URL gives Arduino core 3.3.9 / IDF 5.5.4.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = lolin_c3_mini
framework = arduino

; No upload_port/monitor_port on purpose. The board definition declares
; hwids 303A:1001 (Espressif VID + USB Serial/JTAG PID), so PlatformIO finds
; the board by VID/PID. Hardcoding /dev/tty.usbmodem101 only ever meant editing
; this file on every machine. Override per-invocation if several Espressif
; boards are attached: `pio run -t upload --upload-port /dev/cu.usbmodem101`.
;
; Prefer /dev/cu.* over /dev/tty.* on macOS: tty.* is the callin device and
; blocks on open until DCD asserts, which a USB CDC-ACM device typically never
; does.

monitor_speed = 115200

; esp32_exception_decoder turns a crash backtrace into file:line, which is what
; distinguishes a watchdog reset from a brownout without guessing -- both have
; been suspected on this board. `time` timestamps each line, which is how a
; beep-timing test stays auditable after the fact.
monitor_filters =
    esp32_exception_decoder
    time

; Pinned exactly rather than with a caret. RadioLib sits directly in the
; transmit path (transmitDirect / standby / the CC1101 register writes), so a
; silent minor-version bump is a silent change to RF behaviour.
lib_deps =
    jgromes/RadioLib @ 6.6.0
    adafruit/Adafruit NeoPixel @ 1.15.4

; Deliberately NOT set: build_flags. The lolin_c3_mini board definition already
; supplies -DARDUINO_USB_MODE=1 and -DARDUINO_USB_CDC_ON_BOOT=1 via
; build.extra_flags; repeating them here was pure duplication.
;
; Also deliberately not set: any -O level. The Arduino default is -Os, and the
; transmit loop's timing was characterised against it. Changing optimisation
; would change digitalWrite/micros inlining inside the timing-critical section.
